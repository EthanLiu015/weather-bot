[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-market-maker"
version = "2.0.0"
description = "Market-making bot and research toolkit for Kalshi temperature markets"
requires-python = ">=3.11"
dependencies = [
    # Data
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    # Kalshi API (REST + upcoming websocket depth logger) + auth
    "httpx>=0.27.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
